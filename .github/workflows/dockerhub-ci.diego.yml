name: Docker Hub CI - Diego (Frontend Web)

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build & Push Frontend Web (React + Vite + Nginx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:9090/api/v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/visons-frontend-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/visons-frontend-web:${{ github.sha }}
